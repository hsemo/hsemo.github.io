<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-System Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0e;
    --surface: #0f1214;
    --panel: #131619;
    --border: #1e2428;
    --border-soft: #1a1e22;
    --text: #c8d4cc;
    --text-dim: #5a6860;
    --text-faint: #2e3834;
    --accent: #7eb89a;
    --accent-bright: #a8d4bc;
    --accent-glow: rgba(126, 184, 154, 0.15);
    --gold: #c4a96a;
    --gold-dim: #6b5a32;
    --red: #c46a6a;
    --mono: 'DM Mono', monospace;
    --serif: 'Cormorant Garamond', serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 16px;
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-style: italic;
    font-size: 22px;
    color: var(--accent-bright);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .version-tag {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .header-info {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left panel */
  .panel {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    border-bottom: 1px solid var(--border-soft);
    padding: 16px;
  }

  .panel-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-soft);
  }

  /* Presets */
  .preset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .preset-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 3px;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.3;
  }

  .preset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent-bright);
    background: var(--accent-glow);
  }

  .preset-name {
    display: block;
    font-weight: 500;
  }
  .preset-desc {
    display: block;
    font-size: 9px;
    opacity: 0.6;
    margin-top: 2px;
  }

  /* Controls */
  .control-group {
    margin-bottom: 14px;
  }

  .control-group:last-child { margin-bottom: 0; }

  .control-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .control-value {
    color: var(--gold);
    font-weight: 500;
    font-size: 12px;
    min-width: 40px;
    text-align: right;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    background: var(--accent-bright);
  }

  /* Rules editor */
  .rules-container { display: flex; flex-direction: column; gap: 6px; }

  .rule-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rule-symbol {
    width: 28px;
    flex-shrink: 0;
    text-align: center;
    color: var(--gold);
    font-weight: 500;
    font-size: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 0;
    font-family: var(--mono);
  }

  .arrow {
    color: var(--text-faint);
    font-size: 10px;
    flex-shrink: 0;
  }

  .rule-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
  }

  .rule-input:focus { border-color: var(--accent); }

  .axiom-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .axiom-label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.06em;
  }

  .axiom-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: var(--mono);
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: 0.05em;
  }
  .axiom-input:focus { border-color: var(--gold-dim); }

  /* Generate button */
  .gen-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #5a9e7a 100%);
    border: none;
    color: #0a1a12;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    margin-top: 12px;
  }

  .gen-btn:hover {
    background: linear-gradient(135deg, var(--accent-bright) 0%, var(--accent) 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(126, 184, 154, 0.25);
  }

  .gen-btn:active { transform: translateY(0); }

  /* Color controls */
  .color-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .color-chip {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .color-chip.active,
  .color-chip:hover {
    border-color: white;
    transform: scale(1.15);
  }

  /* Canvas area */
  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: grab;
  }

  canvas:active { cursor: grabbing; }

  /* HUD overlay */
  .hud {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: right;
    pointer-events: none;
  }

  .hud-line {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }

  .hud-line span { color: var(--text-dim); }

  .string-preview {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 10px;
    color: var(--text-faint);
    max-width: 400px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    letter-spacing: 0.05em;
    pointer-events: none;
  }

  /* Controls hint */
  .controls-hint {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    text-align: right;
    line-height: 1.8;
    pointer-events: none;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Generating indicator */
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .generating {
    animation: pulse 0.8s ease-in-out infinite;
    color: var(--accent) !important;
  }

  .toggle-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .toggle-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }
  .toggle-btn:hover:not(.active) {
    border-color: var(--text-faint);
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>L-System Explorer</h1>
    <span class="version-tag">v1.0</span>
  </div>
  <div class="header-info">Lindenmayer System Visualizer · drag to pan · scroll to zoom</div>
</header>

<div class="main">
  <div class="panel">

    <div class="panel-section">
      <div class="section-label">Presets</div>
      <div class="preset-grid" id="presetGrid"></div>
    </div>

    <div class="panel-section">
      <div class="section-label">Grammar</div>

      <div class="control-group">
        <div class="axiom-row">
          <span class="axiom-label">Axiom</span>
          <input type="text" class="axiom-input" id="axiomInput" value="F">
        </div>
      </div>

      <div class="control-group">
        <div class="control-label"><span>Rules</span></div>
        <div class="rules-container" id="rulesContainer"></div>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Iterations</span>
          <span class="control-value" id="iterVal">5</span>
        </div>
        <input type="range" id="iterSlider" min="1" max="10" value="5">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">Rendering</div>

      <div class="control-group">
        <div class="control-label">
          <span>Angle (°)</span>
          <span class="control-value" id="angleVal">25°</span>
        </div>
        <input type="range" id="angleSlider" min="1" max="90" value="25">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Line Length</span>
          <span class="control-value" id="lenVal">8</span>
        </div>
        <input type="range" id="lenSlider" min="1" max="40" value="8">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Line Width</span>
          <span class="control-value" id="widthVal">1.0</span>
        </div>
        <input type="range" id="widthSlider" min="1" max="30" value="10">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Style</span></div>
        <div class="toggle-row">
          <button class="toggle-btn active" id="colorToggle" onclick="toggleColor()">Gradient</button>
          <button class="toggle-btn" id="monoToggle" onclick="toggleMono()">Mono</button>
          <button class="toggle-btn" id="glowToggle" onclick="toggleGlow()">Glow</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label"><span>Palette</span></div>
        <div class="color-row" id="colorRow"></div>
      </div>

      <button class="gen-btn" onclick="generate()">Generate</button>
    </div>

  </div>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="controls-hint">
      scroll · zoom<br>
      drag · pan<br>
      dbl-click · reset
    </div>
    <div class="hud">
      <div class="hud-line" id="hudString">— chars</div>
      <div class="hud-line" id="hudLines">— segments</div>
      <div class="hud-line" id="hudZoom">zoom 1.00×</div>
    </div>
    <div class="string-preview" id="stringPreview"></div>
  </div>
</div>

<script>
// ─── Presets ───────────────────────────────────────────────────────────────
const PRESETS = [
  {
    name: "Dragon",
    desc: "Dragon curve",
    axiom: "FX",
    rules: { X: "X+YF+", Y: "-FX-Y" },
    angle: 90, len: 6, iter: 12, width: 1
  },
  {
    name: "Plant",
    desc: "Fractal plant",
    axiom: "X",
    rules: { X: "F+[[X]-X]-F[-FX]+X", F: "FF" },
    angle: 25, len: 5, iter: 6, width: 1
  },
  {
    name: "Sierpiński",
    desc: "Triangle",
    axiom: "F-G-G",
    rules: { F: "F-G+F+G-F", G: "GG" },
    angle: 120, len: 6, iter: 7, width: 1
  },
  {
    name: "Koch",
    desc: "Snowflake",
    axiom: "F--F--F",
    rules: { F: "F+F--F+F" },
    angle: 60, len: 5, iter: 5, width: 1
  },
  {
    name: "Hilbert",
    desc: "Space-filling",
    axiom: "A",
    rules: { A: "+BF-AFA-FB+", B: "-AF+BFB+FA-" },
    angle: 90, len: 8, iter: 6, width: 1
  },
  {
    name: "Bush",
    desc: "Bushy plant",
    axiom: "Y",
    rules: { X: "X[-FFF][+FFF]FX", Y: "YFX[+Y][-Y]" },
    angle: 25.7, len: 5, iter: 5, width: 1.5
  },
  {
    name: "Gosper",
    desc: "Flowsnake",
    axiom: "A",
    rules: { A: "A+B++B-A--AA-B+", B: "-A+BB++B+A--A-B" },
    angle: 60, len: 6, iter: 5, width: 1
  },
  {
    name: "Lévy C",
    desc: "Lévy curve",
    axiom: "F",
    rules: { F: "+F--F+" },
    angle: 45, len: 5, iter: 12, width: 1
  },
];

// ─── Palettes ──────────────────────────────────────────────────────────────
const PALETTES = [
  { name: "Forest",  start: "#7eb89a", end: "#c4a96a" },
  { name: "Ocean",   start: "#5b9bd5", end: "#7ed9c0" },
  { name: "Ember",   start: "#e07040", end: "#e8d080" },
  { name: "Violet",  start: "#9b6dbf", end: "#e080c0" },
  { name: "Frost",   start: "#80c8e8", end: "#e0f0ff" },
  { name: "Rose",    start: "#c46a8a", end: "#f0c0a0" },
];

// ─── State ─────────────────────────────────────────────────────────────────
let state = {
  preset: 1,
  palette: 0,
  useGradient: true,
  useMono: false,
  useGlow: false,
  currentString: "",
  pan: { x: 0, y: 0 },
  zoom: 1,
  dragging: false,
  lastMouse: { x: 0, y: 0 },
};

// ─── DOM refs ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const axiomInput = document.getElementById('axiomInput');
const iterSlider = document.getElementById('iterSlider');
const iterVal = document.getElementById('iterVal');
const angleSlider = document.getElementById('angleSlider');
const angleVal = document.getElementById('angleVal');
const lenSlider = document.getElementById('lenSlider');
const lenVal = document.getElementById('lenVal');
const widthSlider = document.getElementById('widthSlider');
const widthVal = document.getElementById('widthVal');
const rulesContainer = document.getElementById('rulesContainer');
const hudString = document.getElementById('hudString');
const hudLines = document.getElementById('hudLines');
const hudZoom = document.getElementById('hudZoom');
const stringPreview = document.getElementById('stringPreview');

// ─── Build UI ──────────────────────────────────────────────────────────────
function buildPresets() {
  const grid = document.getElementById('presetGrid');
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (i === state.preset ? ' active' : '');
    btn.innerHTML = `<span class="preset-name">${p.name}</span><span class="preset-desc">${p.desc}</span>`;
    btn.onclick = () => loadPreset(i);
    grid.appendChild(btn);
  });
}

function buildPalettes() {
  const row = document.getElementById('colorRow');
  PALETTES.forEach((p, i) => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (i === state.palette ? ' active' : '');
    chip.style.background = `linear-gradient(135deg, ${p.start}, ${p.end})`;
    chip.title = p.name;
    chip.onclick = () => {
      state.palette = i;
      document.querySelectorAll('.color-chip').forEach((c, j) =>
        c.classList.toggle('active', j === i));
      generate();
    };
    row.appendChild(chip);
  });
}

function buildRules(rules) {
  rulesContainer.innerHTML = '';
  Object.entries(rules).forEach(([sym, prod]) => {
    const row = document.createElement('div');
    row.className = 'rule-row';
    row.innerHTML = `
      <input type="text" class="rule-symbol" value="${sym}" maxlength="1" data-sym>
      <span class="arrow">→</span>
      <input type="text" class="rule-input" value="${prod}" data-prod>`;
    rulesContainer.appendChild(row);
  });
}

function getRules() {
  const rules = {};
  rulesContainer.querySelectorAll('.rule-row').forEach(row => {
    const sym = row.querySelector('[data-sym]').value.trim();
    const prod = row.querySelector('[data-prod]').value.trim();
    if (sym) rules[sym] = prod;
  });
  return rules;
}

// ─── Load preset ───────────────────────────────────────────────────────────
function loadPreset(i) {
  state.preset = i;
  document.querySelectorAll('.preset-btn').forEach((b, j) =>
    b.classList.toggle('active', j === i));
  const p = PRESETS[i];
  axiomInput.value = p.axiom;
  buildRules(p.rules);
  iterSlider.value = p.iter;
  iterVal.textContent = p.iter;
  angleSlider.value = p.angle;
  angleVal.textContent = Math.round(p.angle) + '°';
  lenSlider.value = p.len;
  lenVal.textContent = p.len;
  widthSlider.value = p.width * 10;
  widthVal.textContent = p.width.toFixed(1);
  generate();
}

// ─── L-System string generation ───────────────────────────────────────────
function expandLSystem(axiom, rules, iters) {
  let s = axiom;
  for (let i = 0; i < iters; i++) {
    let next = '';
    for (const ch of s) {
      next += rules[ch] !== undefined ? rules[ch] : ch;
      if (next.length > 2_000_000) { next += '…'; break; }
    }
    s = next;
    if (s.length > 2_000_000) break;
  }
  return s;
}

// ─── Turtle drawing ────────────────────────────────────────────────────────
function turtleDraw(str, angle, len) {
  const stack = [];
  let x = 0, y = 0, dir = -Math.PI / 2;
  const segments = [];
  const rad = angle * Math.PI / 180;

  for (const ch of str) {
    switch (ch) {
      case 'F': case 'G': {
        const nx = x + Math.cos(dir) * len;
        const ny = y + Math.sin(dir) * len;
        segments.push({ x1: x, y1: y, x2: nx, y2: ny });
        x = nx; y = ny;
        break;
      }
      case 'f': {
        x += Math.cos(dir) * len;
        y += Math.sin(dir) * len;
        break;
      }
      case '+': dir += rad; break;
      case '-': dir -= rad; break;
      case '[': stack.push({ x, y, dir }); break;
      case ']': if (stack.length) { ({ x, y, dir } = stack.pop()); } break;
      case '|': dir += Math.PI; break;
    }
  }
  return segments;
}

// ─── Rendering ─────────────────────────────────────────────────────────────
function render(segments) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!segments || segments.length === 0) return;

  // Bounding box
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of segments) {
    minX = Math.min(minX, s.x1, s.x2);
    minY = Math.min(minY, s.y1, s.y2);
    maxX = Math.max(maxX, s.x1, s.x2);
    maxY = Math.max(maxY, s.y1, s.y2);
  }

  const pw = maxX - minX, ph = maxY - minY;
  const fitScale = Math.min((W * 0.85) / (pw || 1), (H * 0.85) / (ph || 1));

  // Transform for current pan/zoom
  ctx.save();
  ctx.translate(W / 2 + state.pan.x, H / 2 + state.pan.y);
  ctx.scale(state.zoom * fitScale, state.zoom * fitScale);
  ctx.translate(-(minX + pw / 2), -(minY + ph / 2));

  const palette = PALETTES[state.palette];
  const n = segments.length;
  const lw = parseFloat(widthVal.textContent) / fitScale / state.zoom;

  if (state.useGlow) {
    ctx.shadowBlur = 4 / fitScale / state.zoom;
    ctx.shadowColor = palette.start;
  }

  // Draw as one gradient path for speed if no glow, else per segment
  if (state.useGradient && !state.useGlow && n > 1) {
    // Batch by color buckets
    const BUCKETS = Math.min(n, 200);
    const bucketSize = Math.ceil(n / BUCKETS);
    for (let b = 0; b < BUCKETS; b++) {
      const t = b / (BUCKETS - 1);
      const color = lerpColor(palette.start, palette.end, t);
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const start = b * bucketSize;
      const end = Math.min(start + bucketSize, n);
      for (let i = start; i < end; i++) {
        const seg = segments[i];
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
      }
      ctx.stroke();
    }
  } else {
    const color = state.useMono ? palette.start : palette.start;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const seg of segments) {
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function lerpColor(c1, c2, t) {
  const parse = c => {
    const n = parseInt(c.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const [r1, g1, b1] = parse(c1);
  const [r2, g2, b2] = parse(c2);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

// ─── Generate ──────────────────────────────────────────────────────────────
let cachedSegments = [];

function generate() {
  hudString.classList.add('generating');
  hudString.textContent = 'computing…';

  setTimeout(() => {
    const axiom = axiomInput.value.trim() || 'F';
    const rules = getRules();
    const iters = parseInt(iterSlider.value);
    const angle = parseFloat(angleSlider.value);
    const len = parseFloat(lenSlider.value);

    const str = expandLSystem(axiom, rules, iters);
    state.currentString = str;

    const segments = turtleDraw(str, angle, len);
    cachedSegments = segments;

    hudString.classList.remove('generating');
    hudString.textContent = `${str.length.toLocaleString()} chars`;
    hudLines.textContent = `${segments.length.toLocaleString()} segs`;
    stringPreview.textContent = str.length > 120 ? str.slice(0, 120) + '…' : str;

    state.pan = { x: 0, y: 0 };
    state.zoom = 1;
    hudZoom.textContent = 'zoom 1.00×';

    render(cachedSegments);
  }, 20);
}

// ─── Style toggles ─────────────────────────────────────────────────────────
function toggleColor() {
  state.useGradient = true; state.useMono = false;
  document.getElementById('colorToggle').classList.add('active');
  document.getElementById('monoToggle').classList.remove('active');
  render(cachedSegments);
}
function toggleMono() {
  state.useGradient = false; state.useMono = true;
  document.getElementById('monoToggle').classList.add('active');
  document.getElementById('colorToggle').classList.remove('active');
  render(cachedSegments);
}
function toggleGlow() {
  state.useGlow = !state.useGlow;
  document.getElementById('glowToggle').classList.toggle('active', state.useGlow);
  render(cachedSegments);
}

// ─── Sliders live update ───────────────────────────────────────────────────
iterSlider.addEventListener('input', () => { iterVal.textContent = iterSlider.value; });
angleSlider.addEventListener('input', () => {
  angleVal.textContent = angleSlider.value + '°';
  if (cachedSegments.length) {
    cachedSegments = turtleDraw(state.currentString, parseFloat(angleSlider.value), parseFloat(lenSlider.value));
    render(cachedSegments);
  }
});
lenSlider.addEventListener('input', () => {
  lenVal.textContent = lenSlider.value;
  if (cachedSegments.length) {
    cachedSegments = turtleDraw(state.currentString, parseFloat(angleSlider.value), parseFloat(lenSlider.value));
    render(cachedSegments);
  }
});
widthSlider.addEventListener('input', () => {
  widthVal.textContent = (parseInt(widthSlider.value) / 10).toFixed(1);
  render(cachedSegments);
});

// ─── Canvas resize ─────────────────────────────────────────────────────────
function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render(cachedSegments);
}
window.addEventListener('resize', resizeCanvas);

// ─── Pan & Zoom ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  state.dragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => { state.dragging = false; });
window.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  state.pan.x += e.clientX - state.lastMouse.x;
  state.pan.y += e.clientY - state.lastMouse.y;
  state.lastMouse = { x: e.clientX, y: e.clientY };
  render(cachedSegments);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.88;
  state.zoom = Math.max(0.05, Math.min(state.zoom * factor, 80));
  hudZoom.textContent = 'zoom ' + state.zoom.toFixed(2) + '×';
  render(cachedSegments);
}, { passive: false });
canvas.addEventListener('dblclick', () => {
  state.pan = { x: 0, y: 0 };
  state.zoom = 1;
  hudZoom.textContent = 'zoom 1.00×';
  render(cachedSegments);
});

// ─── Init ──────────────────────────────────────────────────────────────────
buildPresets();
buildPalettes();
resizeCanvas();
loadPreset(1); // Fractal plant default
</script>
</body>
